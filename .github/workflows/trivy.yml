name: Trivy Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          # Собираем образ из Docker Compose или напрямую
          docker compose build
          # Или если нужно собрать конкретный сервис:
          # docker build -t myapp:latest .

      - name: Get image name from Docker Compose
        id: image
        run: |
          # Получаем имя образа из docker-compose.yml
          IMAGE_NAME=$(docker compose config | grep -A1 'image:' | tail -1 | awk '{print $2}' | head -1)
          echo "name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "Scanning image: $IMAGE_NAME"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.name }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          ignore-unfixed: false

      - name: Run Trivy with SARIF output (optional)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.name }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'